<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الخرائط التفاعلية - نظامي</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .brand span.badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, select, input[type="text"] {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.88rem;
      outline: none;
      transition: 0.15s ease;
    }

    button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      border-color: var(--accent);
      background: #162238;
    }

    button.primary {
      background: var(--accent);
      color: #061322;
      border-color: var(--accent);
      font-weight: 700;
    }

    button.primary:hover {
      filter: brightness(1.08);
    }

    button.danger {
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    button.danger:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    .workspace {
      position: relative;
      flex: 1;
      overflow: hidden;
      background-image: radial-gradient(#243247 1px, transparent 1px);
      background-size: 22px 22px;
    }

    svg#connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .node {
      position: absolute;
      min-width: 170px;
      max-width: 260px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      z-index: 2;
      cursor: grab;
      user-select: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .node:active {
      cursor: grabbing;
    }

    .node.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22), 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .node-title {
      font-weight: 700;
      font-size: 0.94rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .node-note {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-word;
    }

    .node-tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .inspector {
      position: fixed;
      bottom: 16px;
      left: 16px;
      width: 310px;
      max-width: calc(100vw - 32px);
      background: rgba(30, 41, 59, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    }

    .inspector h3 {
      font-size: 0.92rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input, .field textarea, .field select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .inspector-actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      z-index: 15;
    }

    @media (max-width: 720px) {
      .hint {
        display: none;
      }
      .inspector {
        width: calc(100vw - 24px);
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🗺️ خرائط المذاكرة التفاعلية</span>
      <span class="badge">حفظ تلقائي محلي</span>
    </div>

    <div class="toolbar">
      <select id="mapSelector" title="اختر خريطة"></select>
      <button class="primary" id="addNodeBtn">+ إضافة عقدة</button>
      <button id="connectBtn">🔗 ربط بعقدة أخرى</button>
      <button id="newMapBtn">+ خريطة جديدة</button>
      <button id="exportBtn">⬇️ تصدير JSON</button>
      <button id="importBtn">⬆️ استيراد JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </header>

  <main class="workspace" id="workspace">
    <svg id="connections"></svg>
    <div id="nodesContainer"></div>
  </main>

  <aside class="inspector" id="inspector">
    <h3>تعديل العقدة المحددة</h3>
    <div class="field">
      <label for="nodeTitleInput">العنوان</label>
      <input type="text" id="nodeTitleInput" placeholder="مثال: التشريح - الجهاز العصبي" />
    </div>
    <div class="field">
      <label for="nodeNoteInput">ملخص سريع / ملاحظة</label>
      <textarea id="nodeNoteInput" placeholder="اكتب أهم النقاط أو التعريفات هنا..."></textarea>
    </div>
    <div class="field">
      <label for="nodeTagInput">تصنيف / حالة</label>
      <input type="text" id="nodeTagInput" placeholder="مثال: تم المراجعة / أولوية عالية" />
    </div>
    <div class="inspector-actions">
      <button class="primary" id="saveNodeBtn">حفظ التعديل</button>
      <button class="danger" id="deleteNodeBtn">حذف العقدة</button>
    </div>
  </aside>

  <div class="hint">
    اسحب العقد لتحريكها • اضغط "ربط بعقدة أخرى" ثم اختر العقدة الهدف للوصل بينهما
  </div>

  <script>
    const STORAGE_KEY = "interactive_maps_v1";

    const defaultData = {
      activeMapId: "map_horus_sem1",
      maps: {
        map_horus_sem1: {
          name: "مواد الترم الأول - العلوم الصحية",
          nodes: [
            {
              id: "n1",
              title: "العلوم الصحية التطبيقية",
              note: "خريطة مراجعة الفاينل وتقسيم المواد الأساسية",
              tag: "الهدف الرئيسي",
              x: 520,
              y: 90
            },
            {
              id: "n2",
              title: "التشريح (Anatomy)",
              note: "تركيز على الأجهزة، الاتجاهات التشريحية، والمصطلحات المرتبطة",
              tag: "مادة أساسية",
              x: 220,
              y: 250
            },
            {
              id: "n3",
              title: "الفيزياء الحيوية (Biophysics)",
              note: "القوانين، انتقال السوائل والضغط، والتطبيقات الطبية",
              tag: "مادة أساسية",
              x: 520,
              y: 250
            },
            {
              id: "n4",
              title: "المصطلحات الطبية والأخلاقيات",
              note: "الجذور والبادئات واللواحق + أخلاقيات الممارسة الصحية",
              tag: "حفظ ومراجعة",
              x: 820,
              y: 250
            }
          ],
          edges: [
            { from: "n1", to: "n2" },
            { from: "n1", to: "n3" },
            { from: "n1", to: "n4" }
          ]
        }
      }
    };

    let state = loadState();
    let selectedNodeId = state.maps[state.activeMapId]?.nodes[0]?.id || null;
    let connectSourceId = null;
    let draggingNode = null;
    let dragOffset = { x: 0, y: 0 };

    const workspace = document.getElementById("workspace");
    const nodesContainer = document.getElementById("nodesContainer");
    const connectionsSvg = document.getElementById("connections");
    const mapSelector = document.getElementById("mapSelector");
    const titleInput = document.getElementById("nodeTitleInput");
    const noteInput = document.getElementById("nodeNoteInput");
    const tagInput = document.getElementById("nodeTagInput");

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultData);
        const parsed = JSON.parse(raw);
        if (!parsed.maps || !parsed.activeMapId || !parsed.maps[parsed.activeMapId]) {
          return structuredClone(defaultData);
        }
        return parsed;
      } catch {
        return structuredClone(defaultData);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function currentMap() {
      return state.maps[state.activeMapId];
    }

    function renderMapSelector() {
      mapSelector.innerHTML = "";
      Object.entries(state.maps).forEach(([id, map]) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = map.name;
        if (id === state.activeMapId) opt.selected = true;
        mapSelector.appendChild(opt);
      });
    }

    function syncInspector() {
      const map = currentMap();
      const node = map.nodes.find((n) => n.id === selectedNodeId);
      if (!node) {
        titleInput.value = "";
        noteInput.value = "";
        tagInput.value = "";
        return;
      }
      titleInput.value = node.title;
      noteInput.value = node.note || "";
      tagInput.value = node.tag || "";
    }

    function render() {
      renderMapSelector();
      const map = currentMap();
      nodesContainer.innerHTML = "";

      map.nodes.forEach((node) => {
        const el = document.createElement("div");
        el.className = "node" + (node.id === selectedNodeId ? " selected" : "");
        el.style.left = node.x + "px";
        el.style.top = node.y + "px";
        el.dataset.id = node.id;

        el.innerHTML = `
          <div class="node-header">
            <div class="node-title">${escapeHtml(node.title)}</div>
          </div>
          ${node.note ? `<div class="node-note">${escapeHtml(node.note)}</div>` : ""}
          ${node.tag ? `<div class="node-tag">${escapeHtml(node.tag)}</div>` : ""}
        `;

        el.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;

          if (connectSourceId && connectSourceId !== node.id) {
            const exists = map.edges.some(
              (edge) =>
                (edge.from === connectSourceId && edge.to === node.id) ||
                (edge.from === node.id && edge.to === connectSourceId)
            );
            if (!exists) {
              map.edges.push({ from: connectSourceId, to: node.id });
              saveState();
            }
            connectSourceId = null;
            document.getElementById("connectBtn").textContent = "🔗 ربط بعقدة أخرى";
            renderEdges();
            return;
          }

          selectedNodeId = node.id;
          syncInspector();
          document.querySelectorAll(".node").forEach((n) => {
            n.classList.toggle("selected", n.dataset.id === node.id);
          });

          draggingNode = node;
          const rect = workspace.getBoundingClientRect();
          dragOffset.x = e.clientX - rect.left - node.x;
          dragOffset.y = e.clientY - rect.top - node.y;
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener("pointermove", (e) => {
          if (!draggingNode || draggingNode.id !== node.id) return;
          const rect = workspace.getBoundingClientRect();
          const newX = Math.max(12, Math.min(rect.width - 190, e.clientX - rect.left - dragOffset.x));
          const newY = Math.max(12, Math.min(rect.height - 100, e.clientY - rect.top - dragOffset.y));
          node.x = Math.round(newX);
          node.y = Math.round(newY);
          el.style.left = node.x + "px";
          el.style.top = node.y + "px";
          renderEdges();
        });

        el.addEventListener("pointerup", () => {
          if (draggingNode && draggingNode.id === node.id) {
            draggingNode = null;
            saveState();
          }
        });

        nodesContainer.appendChild(el);
      });

      syncInspector();
      renderEdges();
    }

    function renderEdges() {
      const map = currentMap();
      connectionsSvg.innerHTML = "";

      map.edges.forEach((edge) => {
        const fromNode = map.nodes.find((n) => n.id === edge.from);
        const toNode = map.nodes.find((n) => n.id === edge.to);
        if (!fromNode || !toNode) return;

        const fromEl = nodesContainer.querySelector(`.node[data-id="${fromNode.id}"]`);
        const toEl = nodesContainer.querySelector(`.node[data-id="${toNode.id}"]`);

        const x1 = fromNode.x + (fromEl ? fromEl.offsetWidth / 2 : 90);
        const y1 = fromNode.y + (fromEl ? fromEl.offsetHeight / 2 : 35);
        const x2 = toNode.x + (toEl ? toEl.offsetWidth / 2 : 90);
        const y2 = toNode.y + (toEl ? toEl.offsetHeight / 2 : 35);

        const midX = (x1 + x2) / 2;
        const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#38bdf8");
        path.setAttribute("stroke-width", "2.2");
        path.setAttribute("stroke-opacity", "0.7");
        connectionsSvg.appendChild(path);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("addNodeBtn").addEventListener("click", () => {
      const map = currentMap();
      const id = "n_" + Date.now();
      const newNode = {
        id,
        title: "عقدة جديدة",
        note: "أضف تفاصيل أو ملاحظة هنا",
        tag: "جديد",
        x: 160 + ((map.nodes.length * 45) % 420),
        y: 140 + ((map.nodes.length * 40) % 240)
      };
      map.nodes.push(newNode);
      if (selectedNodeId && map.nodes.some((n) => n.id === selectedNodeId)) {
        map.edges.push({ from: selectedNodeId, to: id });
      }
      selectedNodeId = id;
      saveState();
      render();
    });

    document.getElementById("connectBtn").addEventListener("click", (e) => {
      if (!selectedNodeId) return;
      if (connectSourceId === selectedNodeId) {
        connectSourceId = null;
        e.target.textContent = "🔗 ربط بعقدة أخرى";
      } else {
        connectSourceId = selectedNodeId;
        e.target.textContent = "🎯 اختر العقدة الهدف...";
      }
    });

    document.getElementById("saveNodeBtn").addEventListener("click", () => {
      const map = currentMap();
      const node = map.nodes.find((n) => n.id === selectedNodeId);
      if (!node) return;
      node.title = titleInput.value.trim() || "بدون عنوان";
      node.note = noteInput.value.trim();
      node.tag = tagInput.value.trim();
      saveState();
      render();
    });

    document.getElementById("deleteNodeBtn").addEventListener("click", () => {
      const map = currentMap();
      if (!selectedNodeId) return;
      map.nodes = map.nodes.filter((n) => n.id !== selectedNodeId);
      map.edges = map.edges.filter(
        (e) => e.from !== selectedNodeId && e.to !== selectedNodeId
      );
      selectedNodeId = map.nodes[0]?.id || null;
      saveState();
      render();
    });

    mapSelector.addEventListener("change", (e) => {
      state.activeMapId = e.target.value;
      selectedNodeId = currentMap().nodes[0]?.id || null;
      connectSourceId = null;
      saveState();
      render();
    });

    document.getElementById("newMapBtn").addEventListener("click", () => {
      const name = prompt("اكتب اسم الخريطة الجديدة:");
      if (!name || !name.trim()) return;
      const id = "map_" + Date.now();
      const rootId = "n_" + (Date.now() + 1);
      state.maps[id] = {
        name: name.trim(),
        nodes: [
          {
            id: rootId,
            title: name.trim(),
            note: "الفكرة أو الموضوع الرئيسي",
            tag: "رئيسي",
            x: 340,
            y: 160
          }
        ],
        edges: []
      };
      state.activeMapId = id;
      selectedNodeId = rootId;
      saveState();
      render();
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "interactive-maps-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (imported && imported.maps && imported.activeMapId && imported.maps[imported.activeMapId]) {
            state = imported;
            selectedNodeId = currentMap().nodes[0]?.id || null;
            saveState();
            render();
          } else {
            alert("ملف JSON غير متوافق مع بنية الخرائط.");
          }
        } catch {
          alert("تعذر قراءة ملف JSON.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    window.addEventListener("resize", renderEdges);
    render();
  </script>
</body>
</html>
